<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #0b1020;
        color: #f8fafc;
    }

    /* Navbar */
    nav {
        height: 70px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 8%;
        background: #111936;
        border-bottom: 1px solid #29345f;
    }

    .logo {
        font-size: 26px;
        font-weight: bold;
        color: #a78bfa;
    }

    nav ul {
        display: flex;
        list-style: none;
        gap: 30px;
    }

    nav a {
        color: #e2e8f0;
        text-decoration: none;
        transition: 0.3s;
    }

    nav a:hover {
        color: #67e8f9;
    }

    /* Hero */
    .hero {
        min-height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 10%;

        background:
            radial-gradient(
                circle at top left,
                #312e81,
                transparent 40%
            ),
            radial-gradient(
                circle at bottom right,
                #164e63,
                transparent 40%
            ),
            #0b1020;
    }

    .hero h1 {
        font-size: 60px;
        margin-bottom: 20px;
    }

    .hero h1 span {
        color: #67e8f9;
    }

    .hero p {
        font-size: 20px;
        color: #cbd5e1;
        max-width: 700px;
        margin: auto;
        line-height: 1.6;
    }

    .buttons {
        margin-top: 30px;
    }

    .btn {
        display: inline-block;
        padding: 14px 28px;
        margin: 8px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    .primary {
        background: linear-gradient(
            135deg,
            #8b5cf6,
            #06b6d4
        );
        color: white;
    }

    .primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px #06b6d455;
    }

    .secondary {
        border: 1px solid #8b5cf6;
        color: #c4b5fd;
    }

    .secondary:hover {
        background: #8b5cf622;
    }

    /* Tools */
    .tools {
        padding: 80px 8%;
        text-align: center;
        background: #0f172a;
    }

    .tools h2,
    .pipeline h2 {
        font-size: 38px;
        margin-bottom: 40px;
        color: #f8fafc;
    }

    .tool-container {
        display: grid;
        grid-template-columns:
            repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
    }

    .tool {
        background: #171f3a;
        padding: 30px;
        border-radius: 12px;
        border: 1px solid #29345f;
        transition: 0.3s;
    }

    .tool:hover {
        transform: translateY(-8px);
        border-color: #8b5cf6;
        box-shadow: 0 10px 30px #8b5cf622;
    }

    .tool h3 {
        margin-bottom: 10px;
        color: #67e8f9;
    }

    .tool p {
        color: #94a3b8;
    }

    /* Pipeline */
    .pipeline {
        padding: 80px 8%;
        text-align: center;
        background: #080d1c;
    }

    .steps {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    .step {
        background: #171f3a;
        padding: 20px 30px;
        border-radius: 10px;
        border: 1px solid #334155;
        transition: 0.3s;
    }

    .step:hover {
        border-color: #06b6d4;
        transform: translateY(-4px);
    }

    .arrow {
        color: #67e8f9;
        font-size: 28px;
    }

    /* Contact */
    .contact {
        padding: 70px 10%;
        text-align: center;
        background: #111936;
    }

    .contact h2 {
        font-size: 35px;
        margin-bottom: 20px;
        color: #a78bfa;
    }

    .contact p {
        color: #94a3b8;
    }

    /* Footer */
    footer {
        text-align: center;
        padding: 25px;
        background: #060914;
        color: #64748b;
    }

    @media (max-width: 600px) {

        .hero h1 {
            font-size: 40px;
        }

        nav ul {
            gap: 10px;
        }

        .arrow {
            display: none;
        }
    }
</style>
